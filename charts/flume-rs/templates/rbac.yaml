{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flume-rs.serviceAccountName" . }}
  labels:
    {{- include "flume-rs.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "flume-rs.fullname" . }}
  labels:
    {{- include "flume-rs.labels" . | nindent 4 }}
rules:
  # Allow the JobManager to watch pods for TaskManager discovery.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flume-rs.fullname" . }}
  labels:
    {{- include "flume-rs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flume-rs.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flume-rs.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
