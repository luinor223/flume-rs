# Default values for flume-rs Helm chart.

# -- Common settings
nameOverride: ""
fullnameOverride: ""

# -- Docker image settings
image:
  repository: ghcr.io/luinor223/flume
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default is the chart appVersion)
  tag: ""

imagePullSecrets: []

# -- JobManager configuration
jobmanager:
  replicas: 1
  # -- HTTP REST port
  restPort: 8080
  # -- gRPC port for TM communication
  grpcPort: 50051
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  # -- Additional environment variables
  extraEnv: []
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity rules
  affinity: {}
  # -- Pod annotations
  podAnnotations: {}
  # -- Pod security context
  podSecurityContext: {}
  # -- Container security context
  securityContext: {}
  # -- Service type for REST API exposure
  service:
    type: ClusterIP
    annotations: {}
  # -- Liveness probe settings
  livenessProbe:
    httpGet:
      path: /health/live
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  # -- Readiness probe settings
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3

# -- TaskManager configuration
taskmanager:
  replicas: 3
  # -- Number of execution slots per TaskManager
  slots: 4
  # -- gRPC port for receiving commands from JM
  grpcPort: 50052
  # -- Heartbeat interval in seconds
  heartbeatInterval: 5
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  # -- Additional environment variables
  extraEnv: []
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity rules
  affinity: {}
  # -- Pod annotations
  podAnnotations: {}
  # -- Pod security context
  podSecurityContext: {}
  # -- Container security context
  securityContext: {}

# -- TOML configuration file content mounted as a ConfigMap.
# This is the flume.toml content that both JM and TM will load.
flumeConfig: |
  bind_addr = "0.0.0.0:8080"
  checkpoint_dir = "/tmp/flume/checkpoints"

  [pipeline]
  parallelism = 4

# -- RBAC settings
rbac:
  # -- Whether to create RBAC resources
  create: true

# -- Service account settings
serviceAccount:
  # -- Whether to create a service account
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account (generated if not set)
  name: ""

# -- Horizontal Pod Autoscaler for TaskManagers
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 20
  # -- Target average CPU utilization percentage
  targetCPUUtilizationPercentage: 80
  # -- Target average memory utilization percentage
  # targetMemoryUtilizationPercentage: 80
  # -- Custom metrics (e.g. flume_slot_utilization)
  customMetrics: []
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: flume_slot_utilization
  #       target:
  #         type: AverageValue
  #         averageValue: "80"
