[package]
name = "flume-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
flume-core = { path = "../flume-core", version = "0.1.0" }
flume-runtime = { path = "../flume-runtime", version = "0.1.0" }
tokio = { version = "1", features = ["sync", "rt", "macros", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", optional = true }
toml = "1.0"

[dev-dependencies]
tempfile = "3"

[features]
prometheus = ["metrics-exporter-prometheus"]
