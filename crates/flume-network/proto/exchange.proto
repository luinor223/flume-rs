syntax = "proto3";
package flume.exchange;

service DataExchangeService {
    rpc ExchangeData(stream DataBatch) returns (stream CreditGrant);
}

message DataBatch {
    string channel_id = 1;
    bytes payload = 2;
    uint32 record_count = 3;
    bool is_barrier = 4;
    uint64 checkpoint_id = 5;
}

message CreditGrant {
    string channel_id = 1;
    uint32 credits = 2;
}
