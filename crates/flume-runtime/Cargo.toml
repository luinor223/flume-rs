[package]
name = "flume-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
perf = ["core_affinity"]

[dependencies]
flume-core = { path = "../flume-core", version = "0.1.0" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "fs"] }
ahash = "0.8"
crossbeam-utils = "0.8"
core_affinity = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"
