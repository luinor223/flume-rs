[package]
name = "flume-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
flume-core = { path = "../flume-core", version = "0.1.0" }
flume-api = { path = "../flume-api", version = "0.1.0" }
flume-runtime = { path = "../flume-runtime", version = "0.1.0" }
axum = { version = "0.8", features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "signal", "rt-multi-thread", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"

[features]
cli = ["reqwest"]

[[bin]]
name = "flume-server"
path = "src/bin/server.rs"

[[bin]]
name = "flume-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]
